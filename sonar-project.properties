# SonarCloud Proje Tanımlamaları
sonar.organization=onuraydi
sonar.projectKey=onuraydi_OleAI-web
sonar.projectName=OleAI Web App
sonar.projectVersion=1.0

# SonarCloud Sunucu Adresi
sonar.host.url=https://sonarcloud.io

# ---------------------------------------------------------
# 1. ÜRETİM KODLARI (Production Code)
# ---------------------------------------------------------
sonar.sources=src
# Test dosyalarını ve konfigürasyonları analizden dışlıyoruz ki kalite puanımızı haksız yere düşürmesin
sonar.exclusions=src/**/*.test.tsx, src/**/*.test.ts, src/**/*.spec.tsx, src/**/*.spec.ts, src/vite-env.d.ts, src/main.tsx, src/config/**

# ---------------------------------------------------------
# 2. TEST KODLARI (Test Code)
# ---------------------------------------------------------
# SonarCloud'a test dosyalarının nerede olduğunu söylüyoruz
sonar.tests=src
sonar.test.inclusions=src/**/*.test.tsx, src/**/*.test.ts, src/**/*.spec.tsx, src/**/*.spec.ts

# ---------------------------------------------------------
# 3. TEST KAPSAMI (Code Coverage)
# ---------------------------------------------------------
# İleride Vitest/Jest ile test çalıştırdığımızda oluşacak kapsama raporunun yolu
sonar.javascript.lcov.reportPaths=coverage/lcov.info